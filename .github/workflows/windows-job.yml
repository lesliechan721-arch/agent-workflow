name: Windows Job source candidate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Windows Job / fixed-toolchain candidate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tool.outputs.version }}
      source-sha: ${{ steps.tool.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - id: tool
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\nversion=${process.env.RELEASE_TAG ? process.env.RELEASE_TAG.split("/v").at(-1) : JSON.parse(fs.readFileSync("packages/cli/package.json","utf8")).version}\n`);'
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tool.outputs.go }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:windows-job:test
      - run: pnpm native:windows-job:build -- --version "${{ steps.tool.outputs.version }}"
      - run: pnpm native:windows-job:pack -- --version "${{ steps.tool.outputs.version }}"
      - run: pnpm native:windows-job:reproduce -- --candidate ".native/windows-job/${{ steps.tool.outputs.version }}"
      - name: Build only the qualification runtime
        run: |
          pnpm --filter @lesliechan721/agent-skill-eval build
          # Use the plugin's real runtime build in an isolated staging copy.
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          cp -R plugins/agent-subagent "$staging/agent-subagent"
          plugin="$staging/agent-subagent"
          reader="$plugin/commands/scripts/runtime/native-tool-reader.mjs"
          node --input-type=module - "$reader" <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { createNativeToolReaderSource } from './packages/native-runtime/src/reader.mjs';
          await writeFile(process.argv[2], createNativeToolReaderSource());
          JS
          pnpm --dir "$plugin/scripts" install --frozen-lockfile --ignore-scripts
          AW_PLUGIN_NATIVE_READER="$reader" node "$plugin/scripts/build-runtime.mjs"

          # Preserve the paths consumed by qualify.mjs without shipping other Catalog files.
          runtime="$RUNNER_TEMP/windows-job-qualification-runtime/packages"
          mkdir -p "$runtime/agent-skill-eval" "$runtime/cli/plugins-dist/plugins/agent-subagent"
          cp -R packages/agent-skill-eval/dist "$runtime/agent-skill-eval/"
          cp -R "$plugin/commands" "$runtime/cli/plugins-dist/plugins/agent-subagent/"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-qualification-runtime
          path: ${{ runner.temp }}/windows-job-qualification-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-candidate
          path: .native/windows-job/${{ steps.tool.outputs.version }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  qualification:
    name: Windows Job / Windows ${{ matrix.arch }} source qualification
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.source-sha }}
          persist-credentials: false
      - name: Prepare a separate fixed volume for arm64 qualification
        id: workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.arch }}' -eq 'x64') {
            "root=$env:GITHUB_WORKSPACE" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $used = [IO.DriveInfo]::GetDrives().Name
          $letter = [char[]](82..90) | Where-Object { "$($_):\" -notin $used } | Select-Object -First 1
          if (!$letter) { throw 'No unused drive letter for qualification.' }
          $disk = Join-Path $env:RUNNER_TEMP ('aw-artifact-qualification-' + [guid]::NewGuid() + '.vhdx')
          "disk=$disk" >> $env:GITHUB_OUTPUT
          $script = "$disk.attach.txt"
          @(('create vdisk file="' + $disk + '" maximum=4096 type=expandable'), ('select vdisk file="' + $disk + '"'), 'attach vdisk', 'create partition primary', 'format fs=ntfs quick label=aw-artifacts-qualification', "assign letter=$letter") | Set-Content -LiteralPath $script -Encoding ascii
          diskpart.exe /s $script
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare qualification volume.' }
          $volume = "$($letter):\"
          $drive = [IO.DriveInfo]::new($volume)
          if (!$drive.IsReady -or $drive.DriveType -ne [IO.DriveType]::Fixed) { throw 'Qualification volume is not fixed.' }
          $repo = Join-Path $volume 'source'
          New-Item -ItemType Directory -Path $repo | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $repo -Recurse -Force
          }
          "root=$repo" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: tool
        shell: bash
        working-directory: ${{ steps.workspace.outputs.root }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\n`);'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tool.outputs.go }}
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-candidate
          path: ${{ steps.workspace.outputs.root }}/.native/windows-job/${{ needs.candidate.outputs.version }}/
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.workspace.outputs.root }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-qualification-runtime
          path: ${{ steps.workspace.outputs.root }}
      - id: qualify
        run: node native-tools/windows-job/qualify.mjs --candidate ".native/windows-job/${{ needs.candidate.outputs.version }}"
        working-directory: ${{ steps.workspace.outputs.root }}
      - uses: actions/upload-artifact@v7
        if: always() && (steps.qualify.outcome == 'success' || steps.qualify.outcome == 'failure')
        with:
          name: windows-job-qualification-${{ matrix.arch }}
          path: ${{ steps.workspace.outputs.root }}/.native/windows-job/${{ needs.candidate.outputs.version }}/qualification-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Detach qualification volume
        if: always() && steps.workspace.outputs.disk != ''
        shell: pwsh
        env:
          QUALIFICATION_VHD: ${{ steps.workspace.outputs.disk }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:QUALIFICATION_VHD)) { exit 0 }
          $script = "$env:QUALIFICATION_VHD.detach.txt"
          @(('select vdisk file="' + $env:QUALIFICATION_VHD + '"'), 'detach vdisk') | Set-Content -LiteralPath $script -Encoding ascii
          $delays = @(1, 2, 4, 4, 4)
          $detached = $false
          for ($attempt = 0; $attempt -lt $delays.Length; $attempt++) {
            Start-Sleep -Seconds $delays[$attempt]
            try {
              if (!$detached) {
                diskpart.exe /s $script
                if ($LASTEXITCODE -ne 0) { throw 'Cannot detach qualification volume.' }
                $detached = $true
              }
              Remove-Item -LiteralPath $env:QUALIFICATION_VHD
              exit 0
            } catch {
              if ($attempt -eq $delays.Length - 1) { throw }
              Write-Warning 'Qualification volume cleanup will retry.'
            }
          }

  qualified:
    needs: [candidate, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-candidate
          path: candidate
      # Select only the reports; the qualification runtime is not a release artifact.
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-qualification-x64
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-qualification-arm64
          path: candidate
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-qualified
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
