name: Windows Job source candidate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Windows Job / fixed-toolchain candidate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tool.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - id: tool
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\nversion=${process.env.RELEASE_TAG ? process.env.RELEASE_TAG.split("/v").at(-1) : JSON.parse(fs.readFileSync("packages/cli/package.json","utf8")).version}\n`);'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tool.outputs.go }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:windows-job:test
      - run: pnpm native:windows-job:build -- --version "${{ steps.tool.outputs.version }}"
      - run: pnpm native:windows-job:pack -- --version "${{ steps.tool.outputs.version }}"
      - run: pnpm native:windows-job:reproduce -- --candidate ".native/windows-job/${{ steps.tool.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-candidate
          path: .native/windows-job/${{ steps.tool.outputs.version }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  qualification:
    name: Windows Job / Windows ${{ matrix.arch }} source qualification
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          persist-credentials: false
      - name: Prepare a separate fixed volume for arm64 qualification
        id: workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.arch }}' -eq 'x64') {
            "root=$env:GITHUB_WORKSPACE" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $used = [IO.DriveInfo]::GetDrives().Name
          $letter = [char[]](82..90) | Where-Object { "$($_):\" -notin $used } | Select-Object -First 1
          if (!$letter) { throw 'No unused drive letter for qualification.' }
          $disk = Join-Path $env:RUNNER_TEMP ('aw-artifact-qualification-' + [guid]::NewGuid() + '.vhdx')
          "disk=$disk" >> $env:GITHUB_OUTPUT
          $script = "$disk.attach.txt"
          @(('create vdisk file="' + $disk + '" maximum=4096 type=expandable'), ('select vdisk file="' + $disk + '"'), 'attach vdisk', 'create partition primary', 'format fs=ntfs quick label=aw-artifacts-qualification', "assign letter=$letter") | Set-Content -LiteralPath $script -Encoding ascii
          diskpart.exe /s $script
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare qualification volume.' }
          $volume = "$($letter):\"
          $drive = [IO.DriveInfo]::new($volume)
          if (!$drive.IsReady -or $drive.DriveType -ne [IO.DriveType]::Fixed) { throw 'Qualification volume is not fixed.' }
          $repo = Join-Path $volume 'source'
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $repo -Recurse -Force
          "root=$repo" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: tool
        shell: bash
        working-directory: ${{ steps.workspace.outputs.root }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\n`);'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tool.outputs.go }}
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-candidate
          path: ${{ steps.workspace.outputs.root }}/.native/windows-job/${{ needs.candidate.outputs.version }}/
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.workspace.outputs.root }}
      - run: pnpm build
        working-directory: ${{ steps.workspace.outputs.root }}
      - run: node native-tools/windows-job/qualify.mjs --candidate ".native/windows-job/${{ needs.candidate.outputs.version }}"
        working-directory: ${{ steps.workspace.outputs.root }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-qualification-${{ matrix.arch }}
          path: ${{ steps.workspace.outputs.root }}/.native/windows-job/${{ needs.candidate.outputs.version }}/qualification-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Detach qualification volume
        if: always() && steps.workspace.outputs.disk != ''
        shell: pwsh
        env:
          QUALIFICATION_VHD: ${{ steps.workspace.outputs.disk }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:QUALIFICATION_VHD)) { exit 0 }
          $script = "$env:QUALIFICATION_VHD.detach.txt"
          @(('select vdisk file="' + $env:QUALIFICATION_VHD + '"'), 'detach vdisk') | Set-Content -LiteralPath $script -Encoding ascii
          Start-Sleep -Seconds 15
          diskpart.exe /s $script
          if ($LASTEXITCODE -ne 0) { throw 'Cannot detach qualification volume.' }
          Remove-Item -LiteralPath $env:QUALIFICATION_VHD

  qualified:
    needs: [candidate, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-candidate
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-job-qualification-*
          merge-multiple: true
          path: candidate
      - uses: actions/upload-artifact@v7
        with:
          name: windows-job-qualified
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # TEMPORARY: remove these dispatch-only jobs and their two scripts after acceptance.
  acceptance-prepare:
    name: Acceptance / prepare this five-package CLI candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [candidate, qualified]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      bundle_digest: ${{ steps.prepare.outputs.bundle_digest }}
      version: ${{ steps.prepare.outputs.version }}
      candidate_head: ${{ steps.prepare.outputs.candidate_head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-qualified
          path: .native/windows-job/${{ needs.candidate.outputs.version }}/
      - run: pnpm install --frozen-lockfile
      - name: Prepare, record a non-publishing attempt, and seal the real candidate
        id: prepare
        env:
          NATIVE_VERSION: ${{ needs.candidate.outputs.version }}
        run: node .github/scripts/native-cli-acceptance.mjs prepare --native-candidate ".native/windows-job/$NATIVE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: native-cli-acceptance-candidate
          path: .release/native-cli-acceptance/candidate.tar
          if-no-files-found: error
          retention-days: 7

  acceptance-smoke:
    name: Acceptance / ${{ matrix.os }} ${{ matrix.arch }} Node 24 installed candidate
    if: github.event_name == 'workflow_dispatch'
    needs: acceptance-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: win32
            arch: x64
          - runner: windows-11-arm
            os: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_DIGEST: ${{ needs.acceptance-prepare.outputs.bundle_digest }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      AW_TEST_WORKERS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: native-cli-acceptance-candidate
          path: .release/native-cli-acceptance/download
      - name: Verify the same archive and restore file modes
        run: node .github/scripts/native-cli-acceptance.mjs unpack --archive .release/native-cli-acceptance/download/candidate.tar --digest "$CANDIDATE_DIGEST"
      - name: Consume the installed candidate on the real OS and CPU
        run: |
          mkdir -p .release/native-cli-acceptance/reports
          node scripts/release/candidate-smoke.mjs --bundle-root .release/native-cli-acceptance/bundle --product cli --os "$EXPECTED_OS" --arch "$EXPECTED_ARCH" --candidate-digest "$CANDIDATE_DIGEST" | tee ".release/native-cli-acceptance/reports/smoke-$EXPECTED_OS-$EXPECTED_ARCH.json"
      - name: Run standalone Eval after removing CLI and Core
        if: matrix.os == 'win32'
        run: node .github/scripts/native-eval-standalone.mjs --bundle-root .release/native-cli-acceptance/bundle | tee ".release/native-cli-acceptance/reports/standalone-eval-$EXPECTED_ARCH.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-cli-acceptance-smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: .release/native-cli-acceptance/reports/*.json
          if-no-files-found: warn
          retention-days: 7

  acceptance-minimum-node:
    name: Acceptance / Linux x64 exactly Node 22.0.0 installed candidate
    if: github.event_name == 'workflow_dispatch'
    needs: acceptance-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_DIGEST: ${{ needs.acceptance-prepare.outputs.bundle_digest }}
      AW_TEST_WORKERS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.0.0'
          architecture: x64
      - uses: actions/download-artifact@v8
        with:
          name: native-cli-acceptance-candidate
          path: .release/native-cli-acceptance/download
      - run: node .github/scripts/native-cli-acceptance.mjs unpack --archive .release/native-cli-acceptance/download/candidate.tar --digest "$CANDIDATE_DIGEST"
      - run: |
          mkdir -p .release/native-cli-acceptance/reports
          node scripts/release/candidate-smoke.mjs --bundle-root .release/native-cli-acceptance/bundle --product cli --os linux --arch x64 --minimum-node --candidate-digest "$CANDIDATE_DIGEST" | tee .release/native-cli-acceptance/reports/smoke-linux-x64-node-22.0.0.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-cli-acceptance-minimum-node
          path: .release/native-cli-acceptance/reports/*.json
          if-no-files-found: warn
          retention-days: 7
