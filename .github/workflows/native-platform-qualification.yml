name: Windows renderer interruption replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: x64
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: native-tool
        run: node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\n`);'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.native-tool.outputs.go }}
          cache: false
      - run: pnpm native:windows-job:prepare
      - run: node native-tools/windows-job/test-environment.mjs --context-file "$RUNNER_TEMP/aw-native-context.json" --github-env
      - run: pnpm build
      - name: Observe active interruption and a completed Windows Job with pending events
        run: node scripts/qualification/windows-renderer-race.mjs > "$RUNNER_TEMP/windows-renderer-race.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-renderer-race-facts
          path: ${{ runner.temp }}/windows-renderer-race.json
          if-no-files-found: error
          retention-days: 7
