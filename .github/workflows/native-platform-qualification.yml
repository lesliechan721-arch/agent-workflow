name: Intel Copilot user sync replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          architecture: x64
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Observe single-user component installation and synchronization
        run: node scripts/qualification/intel-copilot-sync-replay.mjs --output "$RUNNER_TEMP/intel-copilot-sync.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intel-copilot-user-sync-facts
          path: ${{ runner.temp }}/intel-copilot-sync.json
          if-no-files-found: error
          retention-days: 7
