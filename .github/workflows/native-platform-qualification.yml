name: Native platform qualification (no authentication)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      client:
        description: Fixed-version client to verify
        type: choice
        default: all
        options: [all, codex, pi, claude, gemini, copilot, grok, opencode]
      interfaces_only:
        description: Observe only fixed Cursor and Antigravity interfaces on Ubuntu x64
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  native-windows-job:
    if: (github.event_name == 'workflow_dispatch' && !inputs.interfaces_only) || github.event.label.name == 'native-qualification' || github.event.label.name == 'native-qualification-gemini' || github.event.label.name == 'native-qualification-copilot' || github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
    uses: ./.github/workflows/windows-job.yml
    with:
      source-ref: ${{ github.sha }}

  candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-qualification' || github.event.label.name == 'native-qualification-gemini' || github.event.label.name == 'native-qualification-copilot' || github.event.label.name == 'native-qualification-interfaces' || github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:qualification:native-platforms:harness
      - run: node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs
      - name: Verify the Antigravity User qualification harness
        if: github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
        run: node --test --test-concurrency=1 scripts/qualification/native-platform-antigravity-distributions.test.mjs scripts/qualification/native-platform-antigravity-user.test.mjs
      - name: Bind the candidate to this source and exact bundle bytes
        shell: bash
        run: |
          node scripts/qualification/native-platforms.mjs --write-candidate "$RUNNER_TEMP/candidate.json" --source-sha "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/native-candidate.tgz" packages/cli/dist packages/cli/plugins-dist packages/plugin-core/dist packages/agent-skill-eval/dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-qualification-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/native-candidate.tgz
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: [candidate, native-windows-job]
    # A missing Windows helper must not suppress the Linux/macOS observations.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && !inputs.interfaces_only && github.event.label.name != 'native-qualification-interfaces' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: ${{ fromJSON(github.event.label.name == 'native-qualification-antigravity-user-remaining' && '["macos-15","windows-2025","windows-11-arm"]' || github.event.label.name == 'native-qualification-antigravity-user-windows' && '["windows-2025","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15-intel","macos-15","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    env:
      QUALIFICATION_CLIENT: ${{ inputs.client || (github.event.label.name == 'native-qualification-gemini' && 'gemini') || (github.event.label.name == 'native-qualification-copilot' && 'copilot') || ((github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining') && 'antigravity-user') || 'all' }}
      ANTIGRAVITY_PUBLIC_AW: ${{ github.event.label.name == 'native-qualification-antigravity-user-public' && '1' || '0' }}
      AW_NATIVE_QUALIFICATION_PROCESS_NAMES: '1'
      AW_NATIVE_QUALIFICATION_MANAGED_TRACE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-qualification-candidate
          path: ${{ runner.temp }}/native-candidate
      - name: Restore the same candidate without rebuilding
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/native-candidate/native-candidate.tgz"
      - uses: actions/download-artifact@v8
        if: runner.os == 'Windows'
        with:
          name: windows-job-qualified
          path: .native/windows-job-candidate
      - name: Prepare the qualified Windows helper in its normal optional package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { readCandidate } from './native-tools/windows-job/candidate.mjs';
          import { assertWindowsJobCandidateEvidence } from './native-tools/windows-job/evidence.mjs';
          import { prepareWindowsJobSourceTestEnvironment } from './native-tools/windows-job/test-environment.mjs';
          const root = '.native/windows-job-candidate';
          await assertWindowsJobCandidateEvidence(await readCandidate(root));
          await prepareWindowsJobSourceTestEnvironment({ root });
          JS
      - name: Verify Windows process setup and timeout handling
        if: runner.os == 'Windows'
        run: pnpm test:qualification:native-platforms:harness
      - name: Verify real clients in credential-free temporary environments
        if: env.QUALIFICATION_CLIENT != 'antigravity-user'
        shell: bash
        run: |
          node scripts/qualification/native-platforms.mjs --candidate "$RUNNER_TEMP/native-candidate/candidate.json" --client "$QUALIFICATION_CLIENT" --install --public-aw --report "$RUNNER_TEMP/native-results/report.json"
      - name: Verify the Antigravity User harness on this host
        if: env.QUALIFICATION_CLIENT == 'antigravity-user'
        run: node --test --test-concurrency=1 scripts/qualification/native-platform-antigravity-management.test.mjs scripts/qualification/native-platform-antigravity-distributions.test.mjs scripts/qualification/native-platform-antigravity-user.test.mjs
      - name: Verify fixed Antigravity User management and explicitly requested public AW
        if: env.QUALIFICATION_CLIENT == 'antigravity-user'
        shell: bash
        run: |
          args=(--candidate "$RUNNER_TEMP/native-candidate/candidate.json" --report "$RUNNER_TEMP/native-results/report.json")
          if [[ "$ANTIGRAVITY_PUBLIC_AW" == '1' ]]; then args+=(--public-aw); fi
          node scripts/qualification/native-platform-antigravity-user.mjs "${args[@]}"
      - name: Observe fixed Cursor and Antigravity interfaces without credentials
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' && env.QUALIFICATION_CLIENT == 'all' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-interface-probes"
          node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs | tee "$RUNNER_TEMP/native-interface-probes/harness.log"
          node scripts/qualification/native-platform-interface-probes.mjs --candidate "$RUNNER_TEMP/native-candidate/candidate.json" --report "$RUNNER_TEMP/native-interface-probes/report.json"
      - name: Summarize observed scope results
        if: always()
        shell: bash
        run: node scripts/qualification/native-platform-summary.mjs "$RUNNER_TEMP/native-results/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qualification-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-results/report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.runner == 'ubuntu-24.04' && env.QUALIFICATION_CLIENT == 'all' }}
        continue-on-error: true
        with:
          name: native-interface-probes-ubuntu-24.04
          path: ${{ runner.temp }}/native-interface-probes/
          if-no-files-found: error
          retention-days: 14

  interface-probes:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (inputs.interfaces_only || github.event.label.name == 'native-qualification-interfaces') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-qualification-candidate
          path: ${{ runner.temp }}/native-candidate
      - name: Restore the same candidate without rebuilding
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/native-candidate/native-candidate.tgz"
      - name: Observe only fixed interfaces in credential-free temporary environments
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-interface-probes"
          node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs | tee "$RUNNER_TEMP/native-interface-probes/harness.log"
          node scripts/qualification/native-platform-interface-probes.mjs --candidate "$RUNNER_TEMP/native-candidate/candidate.json" --report "$RUNNER_TEMP/native-interface-probes/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interface-probes-ubuntu-24.04
          path: ${{ runner.temp }}/native-interface-probes/
          if-no-files-found: error
          retention-days: 14
