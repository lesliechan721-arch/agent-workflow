name: Windows x64 Grok target selection comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4a78395e6b2e1fd48c66eace2cbe13b8d01fca9d
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: x64
          cache: pnpm
      - id: native-tool
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\n`);'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.native-tool.outputs.go }}
          cache: false
      - name: Build the candidate with its standard Windows Job helper
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          pnpm install --frozen-lockfile
          pnpm native:windows-job:prepare
          node --input-type=module -e 'import { prepareWindowsJobSourceTestEnvironment as prepare } from "./native-tools/windows-job/test-environment.mjs"; await prepare();'
          pnpm build
      - name: Build the exact baseline with its standard Windows Job helper
        working-directory: baseline
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "4a78395e6b2e1fd48c66eace2cbe13b8d01fca9d" ]
          pnpm install --frozen-lockfile
          pnpm native:windows-job:prepare
          node --input-type=module -e 'import { prepareWindowsJobSourceTestEnvironment as prepare } from "./native-tools/windows-job/test-environment.mjs"; await prepare();'
          pnpm build
      - name: Compare the public target command using the fixed real Grok client
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'grok-windows-target.json'
          node scripts/qualification/grok-windows-target.mjs baseline $report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grok-windows-target-facts
          path: ${{ runner.temp }}/grok-windows-target.json
          if-no-files-found: error
          retention-days: 7
