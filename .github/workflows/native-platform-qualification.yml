name: Native platform qualification (no authentication)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      client:
        description: Fixed-version client to verify
        type: choice
        default: all
        options: [all, codex, pi, claude, copilot, grok, opencode, antigravity-user-public]
      component_matrix:
        description: Also qualify component files, gaps and shipped roles for the selected public AW clients
        type: boolean
        default: false
      interfaces_only:
        description: Observe only fixed Cursor and Antigravity interfaces on Ubuntu x64
        type: boolean
        default: false
      hosts:
        description: Host matrix to verify
        type: choice
        default: all
        options: [all, windows-x64-and-macos-x64, windows-x64-and-arm64]
      qualification_concurrency:
        description: Override the per-job qualification pool for controlled diagnostics
        type: choice
        default: auto
        options: [auto, '1', '2', '3']

permissions:
  contents: read
  actions: read

jobs:
  native-windows-job:
    if: (github.event_name == 'workflow_dispatch' && !inputs.interfaces_only) || github.event.label.name == 'native-qualification' || github.event.label.name == 'native-qualification-components' || github.event.label.name == 'native-qualification-copilot' || github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
    uses: ./.github/workflows/windows-job.yml
    with:
      source-ref: ${{ github.sha }}

  candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-qualification' || github.event.label.name == 'native-qualification-components' || github.event.label.name == 'native-qualification-copilot' || github.event.label.name == 'native-qualification-interfaces' || github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check shipped Catalog capability combinations for all nine targets in both scopes
        run: node scripts/qualification/shipped-catalog-user.mjs "${{ runner.temp }}/shipped-catalog-user.json"
      - run: pnpm test:qualification:native-platforms:harness
      - run: node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs
      - name: Verify the Antigravity User qualification harness
        if: inputs.client == 'antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user' || github.event.label.name == 'native-qualification-antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-windows' || github.event.label.name == 'native-qualification-antigravity-user-remaining'
        run: node --test --test-concurrency=1 scripts/qualification/native-platform-antigravity-distributions.test.mjs scripts/qualification/native-platform-antigravity-user.test.mjs
      - name: Bind the candidate to this source and exact bundle bytes
        shell: bash
        run: |
          node scripts/qualification/native-platforms.mjs --write-candidate "$RUNNER_TEMP/candidate.json" --source-sha "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/native-candidate.tgz" packages/cli/dist packages/cli/plugins-dist packages/plugin-core/dist packages/plugin-core/schemas packages/agent-skill-eval/dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-qualification-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/shipped-catalog-user.json
            ${{ runner.temp }}/native-candidate.tgz
          if-no-files-found: error
          retention-days: 14

  qualify-posix:
    name: qualify (${{ matrix.runner }}${{ contains(matrix.clients, ',') && format(', {0}', matrix.clients) || '' }})
    needs: [candidate]
    # Skip Windows-only selection before scheduling; the runner matrix is always nonempty.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && !inputs.interfaces_only && github.event.label.name != 'native-qualification-interfaces' && inputs.hosts != 'windows-x64-and-arm64' && github.event.label.name != 'native-qualification-antigravity-user-windows' }}
    timeout-minutes: ${{ (inputs.component_matrix || github.event.label.name == 'native-qualification-components') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.hosts == 'windows-x64-and-macos-x64' && '["macos-15-intel"]' || github.event.label.name == 'native-qualification-antigravity-user-remaining' && '["macos-15"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15-intel","macos-15"]') }}
        clients: >-
          ${{ fromJSON(
            ((inputs.client == 'all' && inputs.component_matrix) || github.event.label.name == 'native-qualification-components')
              && '["codex,pi,claude","copilot,grok,opencode"]' ||
            (inputs.client == 'antigravity-user-public' || startsWith(github.event.label.name, 'native-qualification-antigravity-user'))
              && '["antigravity-user"]' ||
            github.event.label.name == 'native-qualification-copilot' && '["copilot"]' ||
            format('[{0}]', toJSON(inputs.client || 'all'))
          ) }}
    runs-on: ${{ matrix.runner }}
    env:
      QUALIFICATION_CLIENT: ${{ matrix.clients }}
      RUN_HOST_CHECKS: ${{ (matrix.clients == 'all' || matrix.clients == 'codex,pi,claude') && '1' || '0' }}
      ANTIGRAVITY_PUBLIC_AW: ${{ (inputs.client == 'antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-public') && '1' || '0' }}
      AW_QUALIFICATION_PUBLIC_COMPONENTS: ${{ (inputs.component_matrix || github.event.label.name == 'native-qualification-components') && '1' || '0' }}
      AW_QUALIFICATION_CONCURRENCY: ${{ inputs.qualification_concurrency != 'auto' && inputs.qualification_concurrency || (matrix.runner == 'macos-15-intel' && (matrix.clients == 'codex,pi,claude' || matrix.clients == 'copilot,grok,opencode') && '1' || startsWith(matrix.runner, 'macos-') && '2' || '3') }}
      AW_NATIVE_QUALIFICATION_PROCESS_NAMES: '1'
      AW_NATIVE_QUALIFICATION_MANAGED_TRACE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-qualification-host
        with:
          runner-label: ${{ matrix.runner }}
      - name: Observe fixed Cursor and Antigravity interfaces without credentials
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' && env.RUN_HOST_CHECKS == '1' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-interface-probes"
          node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs | tee "$RUNNER_TEMP/native-interface-probes/harness.log"
          node scripts/qualification/native-platform-interface-probes.mjs --candidate "$RUNNER_TEMP/native-candidate/candidate.json" --report "$RUNNER_TEMP/native-interface-probes/report.json"
      - name: Summarize observed scope results
        if: always()
        shell: bash
        run: node scripts/qualification/native-platform-summary.mjs "$RUNNER_TEMP/native-results/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qualification-${{ matrix.runner }}${{ matrix.clients == 'copilot,grok,opencode' && '-copilot-grok-opencode' || '' }}
          path: ${{ runner.temp }}/native-results/*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.runner == 'ubuntu-24.04' && env.RUN_HOST_CHECKS == '1' }}
        continue-on-error: true
        with:
          name: native-interface-probes-ubuntu-24.04
          path: ${{ runner.temp }}/native-interface-probes/
          if-no-files-found: error
          retention-days: 14

  qualify-windows:
    name: qualify (${{ matrix.runner }}${{ contains(matrix.clients, ',') && format(', {0}', matrix.clients) || '' }})
    needs: [candidate, native-windows-job]
    # Even when helper qualification fails, this job cannot pass without downloading and validating its evidence.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && !inputs.interfaces_only && github.event.label.name != 'native-qualification-interfaces' }}
    timeout-minutes: ${{ (inputs.component_matrix || github.event.label.name == 'native-qualification-components') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.hosts == 'windows-x64-and-macos-x64' && '["windows-2025"]' || '["windows-2025","windows-11-arm"]') }}
        clients: >-
          ${{ fromJSON(
            ((inputs.client == 'all' && inputs.component_matrix) || github.event.label.name == 'native-qualification-components')
              && '["codex,pi,claude","copilot,grok,opencode"]' ||
            (inputs.client == 'antigravity-user-public' || startsWith(github.event.label.name, 'native-qualification-antigravity-user'))
              && '["antigravity-user"]' ||
            github.event.label.name == 'native-qualification-copilot' && '["copilot"]' ||
            format('[{0}]', toJSON(inputs.client || 'all'))
          ) }}
    runs-on: ${{ matrix.runner }}
    env:
      QUALIFICATION_CLIENT: ${{ matrix.clients }}
      RUN_HOST_CHECKS: ${{ (matrix.clients == 'all' || matrix.clients == 'codex,pi,claude') && '1' || '0' }}
      ANTIGRAVITY_PUBLIC_AW: ${{ (inputs.client == 'antigravity-user-public' || github.event.label.name == 'native-qualification-antigravity-user-public') && '1' || '0' }}
      AW_QUALIFICATION_PUBLIC_COMPONENTS: ${{ (inputs.component_matrix || github.event.label.name == 'native-qualification-components') && '1' || '0' }}
      AW_QUALIFICATION_CONCURRENCY: ${{ inputs.qualification_concurrency != 'auto' && inputs.qualification_concurrency || '2' }}
      AW_NATIVE_QUALIFICATION_PROCESS_NAMES: '1'
      AW_NATIVE_QUALIFICATION_MANAGED_TRACE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-qualification-host
        with:
          runner-label: ${{ matrix.runner }}
      - name: Summarize observed scope results
        if: always()
        shell: bash
        run: node scripts/qualification/native-platform-summary.mjs "$RUNNER_TEMP/native-results/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qualification-${{ matrix.runner }}${{ matrix.clients == 'copilot,grok,opencode' && '-copilot-grok-opencode' || '' }}
          path: ${{ runner.temp }}/native-results/*.json
          if-no-files-found: error
          retention-days: 14

  qualify-ubuntu-extras:
    needs: [candidate]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && !inputs.interfaces_only && (inputs.hosts || 'all') == 'all' && ((inputs.client == 'all' && inputs.component_matrix) || github.event.label.name == 'native-qualification-components') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AW_QUALIFICATION_PUBLIC_COMPONENTS: '1'
      AW_QUALIFICATION_CONCURRENCY: ${{ inputs.qualification_concurrency != 'auto' && inputs.qualification_concurrency || '2' }}
      AW_NATIVE_QUALIFICATION_PROCESS_NAMES: '1'
      AW_NATIVE_QUALIFICATION_MANAGED_TRACE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-qualification-setup
        with:
          components: '1'
      - name: Verify the restored candidate
        id: verify
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import path from 'node:path';
          import { verifyCandidate } from './scripts/qualification/native-platform-runtime.mjs';
          console.log(await verifyCandidate(path.join(process.env.RUNNER_TEMP, 'native-candidate', 'candidate.json')));
          JS
      - name: Verify generic delivery, empty results and foreign content in both scopes
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          node scripts/qualification/native-platform-public-components.mjs --target generic --report "$RUNNER_TEMP/native-results/generic-components.json"
      - name: Verify all shipped plugins through the generic writer in both scopes
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          node scripts/qualification/native-platform-public-components.mjs --target generic --suite candidate --report "$RUNNER_TEMP/native-results/generic-shipped.json"
      - name: Verify project inheritance through the generic writer
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          node scripts/qualification/native-platform-public-components.mjs --target generic --scope project --suite project-inheritance --report "$RUNNER_TEMP/native-results/generic-project-inheritance.json"
      - name: Verify the public Cursor component matrix with its pinned Linux x64 distribution
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          node scripts/qualification/native-platform-public-cursor.mjs "$RUNNER_TEMP/native-results/cursor-components.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qualification-ubuntu-24.04-cursor-generic
          path: ${{ runner.temp }}/native-results/*.json
          if-no-files-found: error
          retention-days: 14

  interface-probes:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (inputs.interfaces_only || github.event.label.name == 'native-qualification-interfaces') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-qualification-setup
      - name: Observe only fixed interfaces in credential-free temporary environments
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-interface-probes"
          node --test --test-concurrency=1 scripts/qualification/native-platform-interface-probes.test.mjs scripts/qualification/native-platform-antigravity-management.test.mjs | tee "$RUNNER_TEMP/native-interface-probes/harness.log"
          node scripts/qualification/native-platform-interface-probes.mjs --candidate "$RUNNER_TEMP/native-candidate/candidate.json" --report "$RUNNER_TEMP/native-interface-probes/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interface-probes-ubuntu-24.04
          path: ${{ runner.temp }}/native-interface-probes/
          if-no-files-found: error
          retention-days: 14
