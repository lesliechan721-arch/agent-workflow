name: Plugin tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            name: Linux x64 / Node 24 / plugin tests
            shard: ''
            timeout: 30
          - runner: macos-15
            os: darwin
            arch: arm64
            name: darwin arm64 / Node 24 / plugin tests
            shard: ''
            timeout: 30
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / plugin tests 1 of 3
            shard: 1/3
            timeout: 90
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / plugin tests 2 of 3
            shard: 2/3
            timeout: 90
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / plugin tests 3 of 3
            shard: 3/3
            timeout: 90
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS || '1' }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Check the native runtime
        run: node -e "if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture'); console.log(process.platform, process.arch, process.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Expose the built CLI on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aw-cli-bin"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' \
            "$(command -v node)" "$GITHUB_WORKSPACE/packages/cli/dist/index.js" \
            > "$RUNNER_TEMP/aw-cli-bin/aw"
          chmod 755 "$RUNNER_TEMP/aw-cli-bin/aw"
          echo "$RUNNER_TEMP/aw-cli-bin" >> "$GITHUB_PATH"
      - name: Expose the built CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cliDirectory = Join-Path $env:RUNNER_TEMP 'aw-cli-bin'
          New-Item -ItemType Directory -Force $cliDirectory | Out-Null
          $nodePath = (Get-Command node).Source
          $entryPath = Join-Path $env:GITHUB_WORKSPACE 'packages/cli/dist/index.js'
          '@echo off', ('"' + $nodePath + '" "' + $entryPath + '" %*') | Set-Content -Encoding utf8 (Join-Path $cliDirectory 'aw.cmd')
          $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run every plugin contract
        if: runner.os != 'Windows'
        run: pnpm plugin:test --all
      # Node shards whole test files, including names in any language. Every
      # shard must pass; no test-name allowlist or fallback can omit a contract.
      - name: Run the Windows plugin file shard
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm plugin:test --all --test-concurrency 1 --test-shard "$env:TEST_SHARD"
      - name: Verify native Windows file locks and cross-volume operations
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        shell: pwsh
        run: node plugins/codex-enhance/scripts/subagent-windows-file-boundaries.mjs
