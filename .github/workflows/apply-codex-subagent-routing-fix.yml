name: Apply Codex subagent routing fix

on:
  push:
    branches:
      - fix/codex-subagent-complexity-routing

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply large eval updates
        run: node .github/scripts/apply-codex-subagent-routing-fix.mjs

      - name: Validate modified artifacts
        run: |
          node --check plugins/codex-enhance/scripts/render-artifacts.mjs
          node --check plugins/codex-enhance/scripts/subagent-artifacts.test.mjs
          node --check plugins/codex-enhance/scripts/subagent-trigger-evals.test.mjs
          node --check plugins/codex-enhance/skills/codex-subagent-guide/evals/eval-harness.mjs
          node --test plugins/codex-enhance/scripts/subagent-artifacts.test.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('plugins/codex-enhance/.agents-plugin/plugin.json', 'utf8'));
          const evals = JSON.parse(fs.readFileSync('plugins/codex-enhance/skills/codex-subagent-guide/evals/evals.json', 'utf8'));
          const evalManifest = JSON.parse(fs.readFileSync('plugins/codex-enhance/skills/codex-subagent-guide/evals/manifest.json', 'utf8'));
          if (manifest.version !== '0.2.0') throw new Error('plugin version was not bumped to 0.2.0');
          if (evals.evals.length !== 20) throw new Error(`expected 20 routing cases, got ${evals.evals.length}`);
          const ids = new Set(evals.evals.map((entry) => entry.id));
          for (const id of ['routine_review_is_general', 'advanced_preset_fresh', 'full_history_preset', 'full_history_custom_model', 'full_history_custom_agent_type']) {
            if (!ids.has(id)) throw new Error(`missing routing case ${id}`);
          }
          const profile = evalManifest.profiles.find((entry) => entry.id === 'project-nondefault');
          const config = profile.plugins[0].config;
          if (!('advancedTaskModel' in config) || 'planningReviewTaskModel' in config) {
            throw new Error('non-default profile did not migrate to advanced task config');
          }
          const checked = [
            'plugins/codex-enhance/.agents-plugin/plugin.json',
            'plugins/codex-enhance/scripts/render-artifacts.mjs',
            'plugins/codex-enhance/scripts/subagent-artifacts.test.mjs',
            'plugins/codex-enhance/scripts/subagent-trigger-evals.test.mjs',
            'plugins/codex-enhance/skills/codex-subagent-guide/README.md',
            'plugins/codex-enhance/skills/codex-subagent-guide/SKILL.md',
            'plugins/codex-enhance/skills/codex-subagent-guide/evals/README.md',
            'plugins/codex-enhance/skills/codex-subagent-guide/evals/eval-harness.mjs',
            'plugins/codex-enhance/skills/codex-subagent-guide/evals/evals.json',
            'plugins/codex-enhance/skills/codex-subagent-guide/evals/manifest.json',
          ].map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          for (const stale of ['codex-subagent-plan-review', 'planningReviewTask', '计划与审核']) {
            if (checked.includes(stale)) throw new Error(`stale routing identifier remains: ${stale}`);
          }
          NODE

      - name: Commit finalized changes
        run: |
          git rm .github/workflows/apply-codex-subagent-routing-fix.yml
          git rm .github/scripts/apply-codex-subagent-routing-fix.mjs
          git add plugins/codex-enhance
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(codex-enhance): finalize complexity routing evals"
          git push origin HEAD:${GITHUB_REF_NAME}
