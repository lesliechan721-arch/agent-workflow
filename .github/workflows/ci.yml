name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Cancel old PR checks. A main run can already be preparing a release candidate.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-tests:
    name: Linux x64 / Node ${{ matrix.node }} / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        suite: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS || '4' }}
    steps:
      - name: Configure test diagnostics
        shell: bash
        run: printf 'AW_TEST_DIAGNOSTICS_DIR=%s/aw-test-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify shipped Catalog User capability matrix
        if: matrix.suite == 'integration' && matrix.node == '24'
        run: node scripts/qualification/shipped-catalog-user.mjs
      - run: pnpm test:${{ matrix.suite }}
      - run: pnpm test:types
        if: matrix.suite == 'unit'
      - name: Save failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-linux-node${{ matrix.node }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/aw-test-diagnostics/publisher/**/*.json
            ${{ runner.temp }}/aw-test-diagnostics/npm/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  release-delivery:
    name: Linux x64 / Node 24 / release delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS }}
    steps:
      - name: Configure test diagnostics
        shell: bash
        run: printf 'AW_TEST_DIAGNOSTICS_DIR=%s/aw-test-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Delivery builds the strict Catalog and dist contracts once. Source tests
      # and types run in linux-tests; beta also requires native evidence.
      - run: pnpm release:verify:delivery
      - run: pnpm test:perf:gate
      - run: pnpm test:smoke:cli:after-delivery
      - run: pnpm test:smoke:bootstrap:catalog
      - run: pnpm release:verify:publish
      - name: Save failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-release-delivery
          path: |
            ${{ runner.temp }}/aw-test-diagnostics/publisher/**/*.json
            ${{ runner.temp }}/aw-test-diagnostics/npm/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  release-native-evidence:
    name: Linux x64 / Node 24 / release native evidence
    needs: native-windows-job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: windows-job-qualified
          path: .native/windows-job-candidate
      - name: Verify this native candidate and both real Windows qualifications
        run: |
          node --input-type=module - <<'JS'
          import { readCandidate } from './native-tools/windows-job/candidate.mjs';
          import { assertWindowsJobCandidateEvidence } from './native-tools/windows-job/evidence.mjs';
          await assertWindowsJobCandidateEvidence(await readCandidate('.native/windows-job-candidate'));
          JS

  plugin-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            name: Linux x64 / Node 24 / plugins
            shard: ''
            timeout: 30
            pack_smoke: false
          - runner: macos-15
            os: darwin
            arch: arm64
            name: macOS arm64 / Node 24 / plugins
            shard: ''
            timeout: 30
            pack_smoke: true
          - runner: windows-2025
            os: win32
            arch: x64
            name: Windows x64 / Node 24 / plugins 1 of 3
            shard: 1/3
            timeout: 90
            pack_smoke: true
          - runner: windows-2025
            os: win32
            arch: x64
            name: Windows x64 / Node 24 / plugins 2 of 3
            shard: 2/3
            timeout: 90
            pack_smoke: false
          - runner: windows-2025
            os: win32
            arch: x64
            name: Windows x64 / Node 24 / plugins 3 of 3
            shard: 3/3
            timeout: 90
            pack_smoke: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS || (matrix.os == 'linux' && '3' || matrix.os == 'darwin' && '2' || '1') }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/plugin-tests
        with:
          arch: ${{ matrix.arch }}
          shard: ${{ matrix.shard }}
      - name: Locate npm download cache
        if: matrix.pack_smoke
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Cache npm downloads for the clean tarball install
        if: matrix.pack_smoke
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.directory }}/_cacache
          key: npm-pack-${{ runner.os }}-${{ matrix.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'packages/*/package.json') }}
          restore-keys: |
            npm-pack-${{ runner.os }}-${{ matrix.arch }}-node24-
      - name: Configure pack smoke diagnostics
        if: matrix.pack_smoke
        shell: bash
        run: printf 'AW_TEST_DIAGNOSTICS_DIR=%s/aw-test-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run the native pack smoke
        if: matrix.pack_smoke
        shell: bash
        env:
          npm_config_cache: ${{ steps.npm-cache.outputs.directory }}
        run: pnpm test:smoke:pack:cli
      - name: Save failed pack smoke diagnostics
        if: failure() && matrix.pack_smoke
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-pack-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/aw-test-diagnostics/publisher/**/*.json
            ${{ runner.temp }}/aw-test-diagnostics/npm/**/*.json
          if-no-files-found: ignore
          retention-days: 7
  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            name: darwin arm64 / Node 24 / integration 1 of 2
            integration_shard: 1/2
            process_lifecycle: false
          - runner: macos-15
            os: darwin
            arch: arm64
            name: darwin arm64 / Node 24 / integration 2 of 2
            integration_shard: 2/2
            process_lifecycle: true
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / integration 1 of 3
            integration_shard: 1/3
            process_lifecycle: false
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / integration 2 of 3
            integration_shard: 2/3
            process_lifecycle: false
          - runner: windows-2025
            os: win32
            arch: x64
            name: win32 x64 / Node 24 / integration 3 of 3
            integration_shard: 3/3
            process_lifecycle: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Configure test diagnostics
        shell: bash
        run: printf 'AW_TEST_DIAGNOSTICS_DIR=%s/aw-test-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Check the native runtime
        run: node -e 'if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected runner architecture"); console.log(process.platform, process.arch, process.version);'
      - run: pnpm install --frozen-lockfile
      - name: Read the Windows source candidate toolchain
        if: matrix.os == 'win32'
        id: native-tool
        run: node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\n`);'
      - uses: actions/setup-go@v6
        if: matrix.os == 'win32'
        with:
          go-version: ${{ steps.native-tool.outputs.go }}
          cache: false
      - run: pnpm native:windows-job:prepare
        if: matrix.os == 'win32'
      - run: node native-tools/windows-job/test-environment.mjs --context-file "$RUNNER_TEMP/aw-native-context.json" --github-env
        if: matrix.os == 'win32'
      - run: pnpm build
      - name: Run the integration shard
        working-directory: packages/cli
        run: node ../../scripts/test/run-vitest.mjs run --project integration tests/integration --config vitest.integration-shard.config.ts --shard "${{ matrix.integration_shard }}"
        env:
          AW_TEST_WORKERS: ${{ vars.AW_TEST_WORKERS || (matrix.os == 'win32' && '1' || '2') }}
          AW_TEST_SHARD_PLATFORM: ${{ matrix.os }}
      - name: Run process lifecycle tests
        if: matrix.process_lifecycle
        working-directory: packages/cli
        run: node ../../scripts/test/run-vitest.mjs run --project process-lifecycle --pool=forks --maxWorkers=1 --no-file-parallelism tests/integration ${{ matrix.os == 'win32' && 'tests/unit/test-command-diagnostics.test.ts' || '' }}
      - name: Verify Windows command runtime configuration paths
        if: matrix.os == 'win32' && matrix.process_lifecycle
        working-directory: packages/cli
        run: node ../../scripts/test/run-vitest.mjs run --project filesystem-isolated tests/unit/command-runtime-config.test.ts
      - name: Save failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-platform-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/aw-test-diagnostics/publisher/**/*.json
            ${{ runner.temp }}/aw-test-diagnostics/npm/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  native-windows-job:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-job.yml

  beta:
    needs: [linux-tests, release-delivery, release-native-evidence, plugin-tests, platform, native-windows-job]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_APP_ID != ''
    uses: ./.github/workflows/beta.yml
    with:
      source: ${{ github.sha }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
