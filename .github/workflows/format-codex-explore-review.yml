name: Normalize codex-explore review patch

on:
  push:
    branches:
      - fix/codex-explore-review-findings

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the trigger corpus and apply the reviewed case change
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const path = 'plugins/codex-enhance/skills/codex-explore/evals/trigger-cases.json';
          const original = JSON.parse(execFileSync(
            'git',
            ['show', `origin/main:${path}`],
            { encoding: 'utf8' },
          ));
          const target = original.cases.find((entry) => entry.id === 'large_pr_review');
          if (!target) throw new Error('large_pr_review case is missing');

          target.query = '请 review changes/large-pr.diff。先把它只作为入口，在这个陌生 repo 的存储、订单和清理模块中追踪 deleteSafely 与 deleteImmediately 的定义、全部调用点和数据流，列出可核验文件证据；探索结果返回后再由主流程判断真实 bug、严重性和修改建议。';
          target.oracle.rationale = '该 diff 只是入口；请求明确要求跨陌生仓库追踪定义、调用点和数据流，事实探索可与最终缺陷判断和建议分离，满足 Gate。';
          target.oracle.allowed_variance = '允许具体 role 选择和说明文案变化；必须加载 owner Skill，并且必须观察到一次子代理启动。';
          target.oracle.minimal_counterexample = '若只要求评价一个已知短 diff，且不要求跨仓库或多来源追踪事实，则不应自动加载或委派。';

          writeFileSync(path, `${JSON.stringify(original, null, 2)}\n`);
          NODE

      - name: Run targeted deterministic checks
        shell: bash
        run: |
          node plugins/codex-enhance/scripts/explore-artifacts.test.mjs
          node plugins/codex-enhance/scripts/trigger-evals.test.mjs
          node plugins/codex-enhance/scripts/liveness-evals.test.mjs

      - name: Commit the normalized patch and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/format-codex-explore-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/codex-enhance .github/workflows/format-codex-explore-review.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(codex-explore): normalize reviewed eval changes"
          git push
