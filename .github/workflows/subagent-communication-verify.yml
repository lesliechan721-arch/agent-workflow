name: Subagent communication verification

on:
  push:
    branches: ['codex/subagent-communication-verify-*']
  workflow_dispatch:
    inputs:
      full_contracts:
        description: Run every plugin contract in disjoint groups
        type: boolean
        default: true
      long_run:
        description: Repeat the real 30-minute qualification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Pushes run only the outstanding native regressions. Use [subagent full] in
  # the final candidate commit to partition named tests without omissions.
  # [subagent remaining] now verifies W-Z: the non-letter fallback selected
  # the entire suite. Current named tests all start with ASCII letters.
  # Native PowerShell preserves patterns without MSYS path conversion.
  # Per-group concurrency keeps other in-flight groups available for reuse.
  # Top-level file checks still run when each group loads the test files.
  # Groups use the existing formal runner; each runner remains serial.
  native-contracts:
    concurrency:
      group: subagent-communication-${{ github.ref }}-${{ matrix.os }}-${{ matrix.group }}
      cancel-in-progress: true
    name: ${{ matrix.os }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(contains(github.event.head_commit.message, '[subagent remaining]') && '[{"runner":"windows-2025","os":"win32","group":"contracts W-Z","pattern":"^[W-Zw-z]"}]' || (contains(github.event.head_commit.message, '[subagent full]') || inputs.full_contracts) && '[{"runner":"ubuntu-24.04","os":"linux","group":"all contracts","pattern":".*"},{"runner":"windows-2025","os":"win32","group":"contracts A-F","pattern":"^[A-Fa-f]"},{"runner":"windows-2025","os":"win32","group":"contracts G-L","pattern":"^[G-Lg-l]"},{"runner":"windows-2025","os":"win32","group":"contracts M","pattern":"^[Mm]"},{"runner":"windows-2025","os":"win32","group":"contracts N-Q","pattern":"^[N-Qn-q]"},{"runner":"windows-2025","os":"win32","group":"contracts R","pattern":"^[Rr]"},{"runner":"windows-2025","os":"win32","group":"contracts S-T","pattern":"^[S-Ts-t]"},{"runner":"windows-2025","os":"win32","group":"contracts U-V","pattern":"^[U-Vu-v]"},{"runner":"windows-2025","os":"win32","group":"contracts W-Z","pattern":"^[W-Zw-z]"}]' || '[{"runner":"windows-2025","os":"win32","group":"bridge regressions","pattern":"^(generated script|close wakes|an abandoned receive|caller and scanner|single-message byte boundary|fixed explicit deadline|default receive timeout|invalid backend readiness)"},{"runner":"windows-2025","os":"win32","group":"parent startup regressions","pattern":"^(installed start preserves|late ready capability)"},{"runner":"windows-2025","os":"win32","group":"adapter child tool regression","pattern":"^Codex: installed child tools"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      EXPECTED_OS: ${{ matrix.os }}
      TEST_NAME_PATTERN: ${{ matrix.pattern }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Check the native runtime
        run: node -e "if (process.platform !== process.env.EXPECTED_OS || process.arch !== 'x64') throw new Error('Unexpected runner'); console.log(process.platform, process.arch, process.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Expose the built CLI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aw-cli-bin"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' \
            "$(command -v node)" "$GITHUB_WORKSPACE/packages/cli/dist/index.js" \
            > "$RUNNER_TEMP/aw-cli-bin/aw"
          chmod 755 "$RUNNER_TEMP/aw-cli-bin/aw"
          echo "$RUNNER_TEMP/aw-cli-bin" >> "$GITHUB_PATH"
      - name: Expose the built CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cliDirectory = Join-Path $env:RUNNER_TEMP 'aw-cli-bin'
          New-Item -ItemType Directory -Force $cliDirectory | Out-Null
          $nodePath = (Get-Command node).Source
          $entryPath = Join-Path $env:GITHUB_WORKSPACE 'packages/cli/dist/index.js'
          '@echo off', ('"' + $nodePath + '" "' + $entryPath + '" %*') | Set-Content -Encoding utf8 (Join-Path $cliDirectory 'aw.cmd')
          $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify formal plugin contracts in this group
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/qualification/subagent-plugin-progress.mjs codex-enhance --test-concurrency 1 --test-name "$TEST_NAME_PATTERN"
      - name: Verify formal plugin contracts in this Windows group
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/qualification/subagent-plugin-progress.mjs codex-enhance --test-concurrency 1 --test-name "$env:TEST_NAME_PATTERN"

  windows-bridge-host:
    concurrency:
      group: subagent-communication-${{ github.ref }}-bridge-host
      cancel-in-progress: true
    if: ${{ !contains(github.event.head_commit.message, '[subagent remaining]') }}
    name: win32 / bridge in native host environment
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify bridge cleanup and native tool lifecycle
        run: node scripts/qualification/subagent-windows-bridge-diagnostics.mjs

  # This is an explicit qualification, never part of ordinary push feedback.
  # Existing native evidence remains reusable when its runtime path is unchanged.
  long-running:
    if: github.event_name == 'workflow_dispatch' && inputs.long_run
    name: ${{ matrix.os }} / real 30-minute qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-2025
            os: win32
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      AW_SUBAGENT_LONG_RUN_MS: '1805000'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Keep the run alive, then exchange messages and finish
        run: node --test --test-name-pattern="long-running default run" plugins/codex-enhance/scripts/subagent-runtime.test.mjs
