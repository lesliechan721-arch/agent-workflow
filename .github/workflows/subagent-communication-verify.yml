name: Subagent communication verification

on:
  push:
    branches: ['codex/subagent-communication-verify-*']

permissions:
  contents: read

concurrency:
  group: subagent-communication-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-module-loading:
    name: win32 / isolated module loading diagnosis
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/qualification/subagent-windows-module-loading.mjs

  windows-communication:
    name: win32 / communication failure diagnosis
    runs-on: windows-2025
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm --dir plugins/codex-enhance/scripts install --frozen-lockfile --ignore-workspace
      - run: node scripts/qualification/subagent-windows-communication-diagnostics.mjs
