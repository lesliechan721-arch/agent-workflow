name: Prepare qualification candidate
description: Restore the exact qualification candidate and host prerequisites without rebuilding.
inputs:
  clients:
    description: Fixed npm clients to acquire (empty disables the download cache).
    default: ''
  components:
    description: Prepare the fixed agent-browser prerequisite for component suites.
    default: '0'
outputs:
  client-cache-key:
    description: Primary key attempted for the exact fixed-client group.
    value: ${{ steps.restore-client-cache.outputs.cache-primary-key }}
  client-cache-hit:
    description: Whether that exact primary key was restored.
    value: ${{ steps.restore-client-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/download-artifact@v4
      with:
        name: native-qualification-candidate
        path: ${{ runner.temp }}/native-candidate
    - name: Restore the same candidate without rebuilding
      shell: bash
      run: tar -xzf - < "$RUNNER_TEMP/native-candidate/native-candidate.tgz"
    - uses: actions/download-artifact@v8
      if: runner.os == 'Windows'
      with:
        name: windows-job-qualified
        path: .native/windows-job-candidate
    - name: Prepare the qualified Windows helper in its normal optional package
      if: runner.os == 'Windows'
      shell: bash
      run: |
        node --input-type=module - <<'JS'
        import { readCandidate } from './native-tools/windows-job/candidate.mjs';
        import { assertWindowsJobCandidateEvidence } from './native-tools/windows-job/evidence.mjs';
        import { prepareWindowsJobSourceTestEnvironment } from './native-tools/windows-job/test-environment.mjs';
        const root = '.native/windows-job-candidate';
        await assertWindowsJobCandidateEvidence(await readCandidate(root));
        await prepareWindowsJobSourceTestEnvironment({ root });
        JS
    - name: Verify Windows process setup and timeout handling
      if: runner.os == 'Windows'
      shell: bash
      run: pnpm test:qualification:native-platforms:harness
    - name: Prepare the browser-use plugin's real preApply prerequisite
      if: inputs.components == '1'
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/native-browser-tool" --ignore-scripts --no-audit --no-fund agent-browser@0.38.1
        node scripts/qualification/native-platform-public-browser.mjs "$RUNNER_TEMP/native-browser-tool" "$RUNNER_TEMP/native-browser-bin"
    - name: Compute the fixed-client download cache identity
      if: inputs.clients != ''
      id: client-cache
      continue-on-error: true
      shell: bash
      env:
        SELECTED_CLIENTS: ${{ inputs.clients }}
      run: |
        node --input-type=module - <<'JS'
        import { appendFileSync } from 'node:fs';
        import path from 'node:path';
        import { clientCacheIdentity } from './scripts/qualification/native-platforms.mjs';
        const identity = clientCacheIdentity(process.env.SELECTED_CLIENTS);
        appendFileSync(process.env.GITHUB_OUTPUT, `identity=${identity}\n`);
        appendFileSync(process.env.GITHUB_ENV, `AW_QUALIFICATION_NPM_CACHE=${path.join(process.env.RUNNER_TEMP, 'native-client-npm-cache')}\n`);
        JS
    - name: Restore npm content downloads for the exact fixed-client group
      if: steps.client-cache.outputs.identity != ''
      id: restore-client-cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/native-client-npm-cache/_cacache
        # Even the implicit primary-key prefix match cannot cross client groups.
        key: native-qualification-npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.client-cache.outputs.identity }}
