name: Plugin tests
description: Build the CLI and run plugin contracts on the native runner.
inputs:
  arch:
    description: Native Node.js architecture.
    required: true
  shard:
    description: Node test file shard for Windows.
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        architecture: ${{ inputs.arch }}
        cache: pnpm
    - name: Check the native runtime
      shell: bash
      run: node -e "if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture'); console.log(process.platform, process.arch, process.version)"
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Read the native producer toolchain
      if: runner.os == 'Windows'
      id: native-tool
      shell: bash
      run: node --input-type=module -e 'import fs from "node:fs"; const tool=JSON.parse(fs.readFileSync("native-tools/windows-job/tool.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `go=${tool.goVersion.slice(2)}\nversion=${tool.version}\n`);'
    - uses: actions/setup-go@v6
      if: runner.os == 'Windows'
      with:
        go-version: ${{ steps.native-tool.outputs.go }}
        cache: false
    - name: Build this source candidate for Windows integration
      if: runner.os == 'Windows'
      shell: bash
      run: pnpm native:windows-job:prepare
    - name: Prepare the current native candidate test context
      if: runner.os == 'Windows'
      shell: bash
      run: node native-tools/windows-job/test-environment.mjs --github-env
    - shell: bash
      run: pnpm build
    - name: Expose the built CLI on POSIX
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/aw-cli-bin"
        printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' \
          "$(command -v node)" "$GITHUB_WORKSPACE/packages/cli/dist/index.js" \
          > "$RUNNER_TEMP/aw-cli-bin/aw"
        chmod 755 "$RUNNER_TEMP/aw-cli-bin/aw"
        echo "$RUNNER_TEMP/aw-cli-bin" >> "$GITHUB_PATH"
    - name: Expose the built CLI on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cliDirectory = Join-Path $env:RUNNER_TEMP 'aw-cli-bin'
        New-Item -ItemType Directory -Force $cliDirectory | Out-Null
        $nodePath = (Get-Command node).Source
        $entryPath = Join-Path $env:GITHUB_WORKSPACE 'packages/cli/dist/index.js'
        '@echo off', ('"' + $nodePath + '" "' + $entryPath + '" %*') | Set-Content -Encoding utf8 (Join-Path $cliDirectory 'aw.cmd')
        $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Run every plugin contract
      if: runner.os != 'Windows'
      shell: bash
      run: pnpm plugin:test --all --native-mode fixture
    # Node shards whole test files, including names in any language. Every
    # shard must pass; no test-name allowlist or fallback can omit a contract.
    - name: Run the Windows plugin file shard
      if: runner.os == 'Windows'
      shell: pwsh
      run: pnpm plugin:test --all --test-concurrency 1 --test-shard "$env:TEST_SHARD" --native-mode source-candidate --native-archive ".native/windows-job/${{ steps.native-tool.outputs.version }}/lesliechan721-aw-windows-job-win32-${{ inputs.arch }}-${{ steps.native-tool.outputs.version }}.tgz"
      env:
        AW_SUBAGENT_COMMUNICATION_DIAGNOSTICS: '1'
