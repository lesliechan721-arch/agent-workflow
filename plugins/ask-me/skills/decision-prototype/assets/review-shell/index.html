<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype Review</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <header class="decision-header">
      <p class="eyebrow">Prototype Review</p>
      <h1 id="question">加载中…</h1>
      <p id="meta" class="meta"></p>
      <dl id="decisionContext" class="decision-context" hidden>
        <div>
          <dt>目标</dt>
          <dd id="decisionGoal"></dd>
        </div>
        <div>
          <dt>比较重点</dt>
          <dd><ul id="decisionPriorities"></ul></dd>
        </div>
        <div>
          <dt>约束</dt>
          <dd><ul id="decisionConstraints"></ul></dd>
        </div>
      </dl>
    </header>

    <form id="reviewForm" novalidate>
      <section class="panel preview-workspace" aria-labelledby="candidatesHeading">
        <div class="section-heading">
          <div>
            <h2 id="candidatesHeading">候选预览</h2>
            <p class="section-description">先查看候选，再选择要支持的方向。</p>
          </div>
          <div class="preview-actions">
            <div id="viewportControls" class="segmented" aria-label="HTML 预览宽度" hidden>
              <button type="button" data-viewport="desktop" aria-pressed="true">桌面</button>
              <button type="button" data-viewport="mobile" aria-pressed="false">手机</button>
            </div>
            <button id="compareToggle" type="button" class="secondary" aria-pressed="false" hidden>并排比较</button>
          </div>
        </div>
        <nav id="candidateTabs" class="candidate-tabs" aria-label="候选预览" hidden></nav>
        <fieldset id="candidateSelection" class="candidate-selection" hidden>
          <legend>选择要反馈的候选</legend>
          <div id="selectionChoices"></div>
        </fieldset>
        <p id="selectionError" class="field-error" role="alert" hidden></p>
        <div id="previewHost" class="preview-host" aria-live="polite"></div>
      </section>

      <section id="guided" class="panel" aria-labelledby="guidedHeading" hidden>
        <h2 id="guidedHeading">引导问题</h2>
        <div id="guidedQuestions"></div>
        <p id="guidedError" class="field-error" role="alert" hidden></p>
      </section>

      <section id="tokens" class="panel" aria-labelledby="tokensHeading" hidden>
        <h2 id="tokensHeading">受控参数</h2>
        <div id="tokenControls" class="token-controls"></div>
        <p id="tokensError" class="field-error" role="alert" hidden></p>
      </section>

      <section id="annotationPanel" class="panel" aria-labelledby="annotationHeading" hidden>
        <div class="section-heading">
          <div>
            <h2 id="annotationHeading">局部标注</h2>
            <p id="annotationHelp" class="section-description"></p>
          </div>
        </div>
        <div class="annotation-target-picker">
          <h3>标注目标</h3>
          <p id="annotationKeyboardHelp" class="section-description"></p>
          <div id="annotationTargets" class="annotation-targets"></div>
        </div>
        <p id="annotationEmpty">还没有标注。</p>
        <ol id="annotations" class="annotation-list"></ol>
        <p id="annotationError" class="field-error" role="alert" hidden></p>
      </section>

      <section class="panel" aria-labelledby="notesHeading">
        <h2 id="notesHeading">整体观察</h2>
        <label for="globalNotes">补充说明（可选）</label>
        <textarea id="globalNotes" rows="5" placeholder="说明整体观察、需要修改的部分或其它方向。"></textarea>
        <p id="notesError" class="field-error" role="alert" hidden></p>
      </section>

      <section class="panel verdict-panel" aria-labelledby="verdictHeading">
        <fieldset id="verdictFieldset">
          <legend id="verdictHeading">总体判断</legend>
          <div class="verdict-options">
            <label><input type="radio" name="verdict" value="accepted"> 接受当前方向</label>
            <label><input type="radio" name="verdict" value="revise"> 方向正确，需要修改</label>
            <label id="rejectedVerdict"><input type="radio" name="verdict" value="rejected"> 当前候选都不合适</label>
            <label><input type="radio" name="verdict" value="new-material-question"> 这个问题还需要先澄清</label>
          </div>
        </fieldset>
        <p id="verdictError" class="field-error" role="alert" hidden></p>
        <div id="verdictDetail" hidden>
          <label id="verdictDetailLabel" for="verdictDetailInput"></label>
          <textarea id="verdictDetailInput" rows="4"></textarea>
          <p id="verdictDetailError" class="field-error" role="alert" hidden></p>
        </div>
      </section>

      <p id="formError" class="form-error" role="alert" tabindex="-1" hidden></p>
      <footer class="submit-bar">
        <button id="submitFeedback" type="submit" class="primary">提交反馈</button>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </form>

    <section id="success" class="success-panel" tabindex="-1" hidden>
      <h2>反馈已提交</h2>
      <p>反馈已提交。Agent 已收到，可以关闭本页。</p>
    </section>
  </main>

  <aside id="annotationDrawer" class="annotation-drawer" role="dialog" aria-modal="false" aria-labelledby="annotationDrawerHeading" hidden>
    <div class="drawer-heading">
      <div>
        <p class="eyebrow">局部标注</p>
        <h2 id="annotationDrawerHeading">添加标注</h2>
      </div>
      <button id="closeAnnotation" type="button" class="icon-button" aria-label="关闭标注编辑器">×</button>
    </div>
    <p><strong>目标：</strong><span id="annotationTarget"></span></p>
    <label for="annotationCategory">类型</label>
    <select id="annotationCategory">
      <option value="information-hierarchy">信息层级</option>
      <option value="interaction">交互</option>
      <option value="visual">视觉</option>
      <option value="content">内容</option>
      <option value="other">其它</option>
    </select>
    <label for="annotationComment">问题</label>
    <textarea id="annotationComment" rows="5"></textarea>
    <p id="annotationCommentError" class="field-error" role="alert" hidden></p>
    <label for="annotationOutcome">期望结果</label>
    <textarea id="annotationOutcome" rows="4"></textarea>
    <div class="drawer-actions">
      <button id="saveAnnotation" type="button">保存</button>
      <button id="cancelAnnotation" type="button" class="secondary">取消</button>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
